services:
  backend:
    build:
      context: .
      dockerfile: deployment/docker/backend.Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://forensic:forensic@mysql:3306/forensic_triage
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./ml/saved_models:/app/ml/saved_models

  frontend:
    build:
      context: .
      dockerfile: deployment/docker/frontend.Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=forensic_triage
      - MYSQL_USER=forensic
      - MYSQL_PASSWORD=forensic
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
